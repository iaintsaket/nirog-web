# Deploys the website to Cloudflare Pages after CI passes on main, and records it as a release.
# It runs the same script a person would (deploy/cloudflare-pages.sh), so moving hosts means
# changing that script and these secrets, not this pipeline.
#
# Every deploy gets a semantic version (v1.0.0, v1.0.1, ...): a Git tag, a GitHub Release listing its
# PRs, and the same label on the Cloudflare deployment. A merge bumps the patch number; label the PR
# "release: minor" (new feature) or "release: major" (big change) to bump those instead. To go back, run the "rollback" workflow with a version
# (or deploy/rollback-pages.sh locally): it is instant, with no rebuild.
#
# Repo secrets: CLOUDFLARE_API_TOKEN (Pages: Edit only), CLOUDFLARE_ACCOUNT_ID.
# Repo variable (optional): NEXT_PUBLIC_SIGN_IN=on shows Google sign-in; unset keeps it hidden.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-pages
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  pages:
    name: Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
    environment:
      name: production
      url: https://nirog.pages.dev
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # tags, for the version number and release notes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Medicine pages need the catalogue from the API. It only changes when prices are imported,
      # so it is cached per import date: one tiny /v1/stats call per deploy, a full fetch
      # (~20 requests) only after an import.
      - name: Price import date
        id: prices
        run: echo "date=$(curl -sf https://nirog.pages.dev/v1/stats | jq -r '.prices_updated_on // "unknown"')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data/medicines.json
          key: medicines-v1-${{ steps.prices.outputs.date }}
      - name: Pick the version
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -qx 'release: major' <<< "$labels"; then next="v$((major + 1)).0.0"
            elif grep -qx 'release: minor' <<< "$labels"; then next="v$major.$((minor + 1)).0"
            else next="v$major.$minor.$((patch + 1))"; fi
          fi
          echo "VERSION=$next" >> "$GITHUB_ENV"
          echo "PREVIOUS=$last" >> "$GITHUB_ENV"
          echo "Releasing $next (previous: ${last:-none})"
      - name: Build and upload
        run: deploy/cloudflare-pages.sh nirog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SIGN_IN: ${{ vars.NEXT_PUBLIC_SIGN_IN }}
      - name: Record the release (it is live from here on)
        run: |
          notes="Live at https://nirog.pages.dev. Roll back from Actions → rollback, or: deploy/rollback-pages.sh <version>."
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --notes "$notes" --generate-notes \
            ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
      - name: Smoke test the live site
        run: |
          for path in / /v1/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://nirog.pages.dev$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
          deploy/expect-live-version.sh "$VERSION"
      - name: Look and layout checks on the live site
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npm run test:live
      - name: Live screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-look-and-layout-report
          path: playwright-report/
          retention-days: 30
      - name: Flag the release if the live checks failed
        if: failure() && env.VERSION != ''
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || exit 0
          body="$(gh release view "$VERSION" --json body --jq .body)"
          gh release edit "$VERSION" --title "$VERSION (live checks failed)" --notes "⚠️ Live checks failed after this deploy. To go back to the previous release, run Actions → rollback with ${PREVIOUS:-the previous version}.

          $body"
