# Deploys the website to Cloudflare Pages after CI passes on main.
# It runs the same script a person would (deploy/cloudflare-pages.sh), so moving hosts means
# changing that script and these secrets, not this pipeline.
# Repo secrets: CLOUDFLARE_API_TOKEN (Pages: Edit only), CLOUDFLARE_ACCOUNT_ID.
# Repo variable (optional): NEXT_PUBLIC_SIGN_IN=on shows Google sign-in; unset keeps it hidden.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-pages
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  pages:
    name: Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nirog.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build and upload
        run: deploy/cloudflare-pages.sh nirog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SIGN_IN: ${{ vars.NEXT_PUBLIC_SIGN_IN }}
      - name: Smoke test the live site
        run: |
          for path in / /v1/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://nirog.pages.dev$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
