name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  web:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API client matches the API's published openapi.json
        run: |
          OPENAPI_SPEC=https://raw.githubusercontent.com/iaintsaket/nirog-api/main/openapi.json npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with 80% coverage gate
        run: npm run test:coverage
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  look:
    name: look and layout (phone + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Checks on iPhone Safari engine, Android Chrome and desktop Chrome (API answers from e2e/fixtures)
        run: npm run test:e2e
      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: look-and-layout-report
          path: playwright-report/
          retention-days: 14

  ci:
    name: ci
    if: always()
    needs: [web, secrets, look]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
