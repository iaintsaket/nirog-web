version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # openapi-typescript (API client generator) needs TypeScript 5; lift when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node's type definitions should match the Node version CI and deploys build with (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
